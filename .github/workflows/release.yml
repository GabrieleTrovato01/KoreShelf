name: Pacchetti KoreShelf (exe, dmg, AppImage, apk, ipa)

# - push di un tag "v4.0.0"  -> crea la Release con i tre pacchetti allegati
# - scheda Actions -> "Run workflow" -> i pacchetti si scaricano dagli Artifacts
# - ogni push su main -> controllo che tutto compili e i test passino
on:
  push:
    branches: [main, rust_version]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Interfaccia
        working-directory: frontend
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --no-default-features
      - name: Compila
        run: |
          cargo build --release
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist && cp target/release/koreshelf.exe "dist/KoreShelf-${VERSION}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: KoreShelf-windows
          path: dist/*.exe
      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.exe }

  macos:
    name: macOS (.dmg universale Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Interfaccia
        working-directory: frontend
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - name: Compila (Apple Silicon e Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/koreshelf \
            target/aarch64-apple-darwin/release/koreshelf \
            target/x86_64-apple-darwin/release/koreshelf
          dist/koreshelf --version
      - name: Crea KoreShelf.app e il .dmg (universal)
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          packaging/macos/make-app.sh dist/koreshelf dist
          packaging/macos/make-dmg.sh dist/KoreShelf.app "dist/KoreShelf-${VERSION}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: KoreShelf-macos
          path: dist/*.dmg
      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.dmg }

  linux:
    name: Linux (.AppImage)
    # Ubuntu 22.04: glibc meno recente = l'AppImage funziona su più distribuzioni
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            librsvg2-dev file xvfb squashfs-tools
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Interfaccia
        working-directory: frontend
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compila
        run: cargo build --release
      # Strumenti per l'AppImage in cache: dopo la prima volta non si riscaricano
      # (i server dei download a volte rispondono 504)
      - name: Strumenti AppImage (dalla cache)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/appimage-tools
          key: appimage-tools-${{ runner.os }}-${{ hashFiles('packaging/linux/build-appimage.sh') }}
      - name: Crea l'AppImage
        env: { KORESHELF_TOOLS: "${{ runner.temp }}/appimage-tools" }
        run: packaging/linux/build-appimage.sh target/release/koreshelf dist
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Prova l'AppImage (avvio reale su display virtuale)
        env: { KORESHELF_TOOLS: "${{ runner.temp }}/appimage-tools" }
        run: |
          pip install pyyaml pillow
          ONLY=appimage python3 tests/packaging/test_packaging.py
      # Salvata anche se il job fallisce: un download riuscito non va perso
      - name: Strumenti AppImage (in cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/appimage-tools
          key: appimage-tools-${{ runner.os }}-${{ hashFiles('packaging/linux/build-appimage.sh') }}
      - uses: actions/upload-artifact@v4
        with:
          name: KoreShelf-linux
          path: dist/*.AppImage
      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.AppImage }

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # Gradle in cache (anche la sua distribuzione: niente download da services.gradle.org ogni volta)
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Di default la cache si salva solo sul ramo principale: la salviamo su ogni push
          # (anche su rust_version), mai dalle Pull Request
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@v3
        # Il vecchio pacchetto "tools" non esiste più negli strumenti SDK recenti
        with: { packages: "platform-tools build-tools;35.0.0" }
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Interfaccia
        working-directory: frontend
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "mobile/src-tauri -> ../../target" }
      - name: Progetto Android
        working-directory: mobile
        run: |
          npm ci
          npx tauri android init --ci
          npx tauri icon app-icon.png
          ../packaging/mobile/patch-android.sh src-tauri/gen/android
      - name: Compila l'APK (release)
        working-directory: mobile
        env: { CARGO_TARGET_DIR: "${{ github.workspace }}/target" }
        # Fino a 3 tentativi: se fallisce è quasi sempre un server di download momentaneamente
        # irraggiungibile; Rust è già compilato, quindi i tentativi successivi sono rapidi
        run: |
          for attempt in 1 2 3; do
            npx tauri android build --apk --target aarch64 --target armv7 && exit 0
            echo "::warning::Tentativo $attempt non riuscito, riprovo tra $((attempt * 30)) secondi"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Firma l'APK
        env:
          # I secrets arrivano come variabili d'ambiente: non compaiono mai nei comandi né nei log
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          OUT="dist/KoreShelf-${VERSION}-android.apk"
          mkdir -p dist

          echo "==> Strumenti di firma"
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BUILD_TOOLS"
          [ -x "$BUILD_TOOLS/apksigner" ] && [ -x "$BUILD_TOOLS/zipalign" ] || fail "apksigner/zipalign non trovati in $BUILD_TOOLS"

          echo "==> APK da firmare"
          UNSIGNED=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          [ -n "$UNSIGNED" ] || fail "APK release non trovato"
          ls -lh "$UNSIGNED"

          echo "==> Allineamento (zipalign)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk" || fail "zipalign non riuscito"

          echo "==> Chiave di firma"
          KEYSTORE="$RUNNER_TEMP/release-key.jks"
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE" \
              || fail "ANDROID_KEYSTORE_BASE64 non è un Base64 valido: ricopialo dal comando di PowerShell"
            echo "chiave del progetto ($(stat -c%s "$KEYSTORE") byte)"
          else
            # Nessuna chiave (es. Pull Request da un fork): APK installabile per le prove,
            # ma gli aggiornamenti richiederanno di disinstallare la versione precedente.
            echo "::warning::Secrets di firma assenti: APK firmato con una chiave temporanea"
            KS_PASSWORD="temporary-$RANDOM$RANDOM"
            KS_ALIAS="temporary"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$KS_PASSWORD" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 30 -dname "CN=KoreShelf (build di prova)" -noprompt
          fi
          export KS_PASSWORD
          keytool -list -keystore "$KEYSTORE" -storepass:env KS_PASSWORD > /dev/null 2>&1 \
            || fail "La chiave non si apre: controlla ANDROID_KEYSTORE_PASSWORD (e ANDROID_KEYSTORE_BASE64)"
          keytool -list -keystore "$KEYSTORE" -storepass:env KS_PASSWORD -alias "$KS_ALIAS" > /dev/null 2>&1 \
            || fail "Alias non trovato nella chiave: controlla ANDROID_KEY_ALIAS (quello usato con -alias in keytool)"
          echo "chiave e alias verificati"

          echo "==> Firma (apksigner)"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass env:KS_PASSWORD --ks-key-alias "$KS_ALIAS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk" || fail "Firma non riuscita"
          rm -f "$KEYSTORE" "$RUNNER_TEMP/aligned.apk"

          echo "==> Verifica della firma"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" || fail "La firma dell'APK non è valida"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: KoreShelf-android
          path: dist/*.apk
      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.apk }

  ios:
    name: iOS (.ipa non firmato)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Interfaccia
        working-directory: frontend
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "mobile/src-tauri -> ../../target" }
      - name: Progetto Xcode
        working-directory: mobile
        run: |
          npm ci
          npx tauri ios init --ci
          npx tauri icon app-icon.png
      - name: Compila l'.ipa (senza firma)
        working-directory: mobile
        env: { CARGO_TARGET_DIR: "${{ github.workspace }}/target" }
        # Senza account Apple l'app non si può firmare: --no-sign produce un .ipa non firmato,
        # da firmare prima di installarlo (con il proprio ID Apple tramite Sideloadly o AltStore).
        run: npx tauri ios build --ci --no-sign --target aarch64
      - name: Raccogli l'.ipa
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          IPA=$(find mobile/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          test -n "$IPA" || { echo ".ipa non trovato" >&2; exit 1; }
          cp "$IPA" "dist/KoreShelf-${VERSION}-ios-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: KoreShelf-ios
          path: dist/*.ipa
      - name: Allega alla Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.ipa }
