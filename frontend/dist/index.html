    <!-- App: scala sempre 1:1 (niente zoom automatici dopo una rotazione); zone di sistema gestite con env() -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>KoreShelf</title>
    <script>
      // Altezza VISIBILE dello schermo in --ks-app-h. Nei browser dei telefoni 100vh vale l'altezza
      // con la barra del browser nascosta: il lettore finirebbe in parte sotto la barra.
      // Gira per primo, così chi ricalcola al "resize" (il lettore) trova già il valore giusto.
      (function () {
        var root = document.documentElement;
        function update() {
          var vv = window.visualViewport;
          var h = vv ? vv.height * (vv.scale || 1) : window.innerHeight;
          if (h > 0) root.style.setProperty('--ks-app-h', Math.round(h) + 'px');
        }
        update();
        window.addEventListener('resize', update);
        window.addEventListener('orientationchange', update);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', function () {
          var before = root.style.getPropertyValue('--ks-app-h');
          update();
          // la barra del browser è comparsa o sparita senza un "resize" della finestra
          if (root.style.getPropertyValue('--ks-app-h') !== before) window.dispatchEvent(new Event('resize'));
        });
      })();
    </script>

    <style>
        /* Animazione e stile per la freccia di scroll */
        @keyframes bounce-glass {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-10px) translateX(-50%); }
            60% { transform: translateY(-5px) translateX(-50%); }
        }

        .glass-scroll-arrow {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            z-index: 1001;
            pointer-events: none;
            animation: bounce-glass 2.5s infinite;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: opacity 0.4s ease;
        }

        /* Nasconde la scrollbar nativa ma mantiene lo scorrimento attivo */
        #pdf-container::-webkit-scrollbar { display: none; }
        #pdf-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
